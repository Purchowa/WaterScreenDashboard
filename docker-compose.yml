  #     MONGO_INITDB_DATABASE: 

  backend:
    container_name: waterscreen_backend
    build: ./backend
    env_file:
      - ./backend/.env
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M

  nginx:
    container_name: waterscreen_nginx
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    restart: unless-stopped
    ports:
      - 80:80
    depends_on:
      - backend


